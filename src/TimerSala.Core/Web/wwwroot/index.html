<style>
  :root {
    --bg: #000; --fg: #f4f5f7; --muted: #8b919c; --card: #15171c; --line: #262a32;
    --green: #22c55e; --amber: #fbbf24; --red: #ef4444; --accent: #3b82f6;
    --font: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  body.theme-light {
    --bg: #fff; --fg: #111827; --muted: #4b5563; --card: #f3f4f6; --line: #e5e7eb;
    --green: #15803d; --amber: #b45309; --red: #b91c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
  body { display: flex; flex-direction: column; }
  body.overtime { background: #1d0505; }
  body.theme-light.overtime { background: #fde2e2; }
  #hg { position: fixed; left: 0; top: 0; bottom: 0; width: 0; background: var(--green); opacity: .45; display: none; transition: width .25s linear, background .3s; }
  body.layout-hourglass:not(.idle) #hg { display: block; }
  body.layout-hourglass .bar, body.layout-digits .bar, body.layout-digits .top, body.layout-digits .bottom { display: none; }
  body.layout-hourglass #digits { color: var(--fg) !important; }
  #timer, .tools, #schedule { position: relative; z-index: 1; }
  body.mono #digits:not(.idle) { color: var(--fg); }
  body.hide-title #title, body.hide-section #section, body.hide-section .chip, body.hide-bar .bar { visibility: hidden; }
  body.flash.overtime #digits { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  #timer { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 3vh 4vw 2vh; }
  .top { display: flex; align-items: center; gap: 1.5vw; min-height: 12vh; }
  .chip { width: 1.2vmin; min-width: 8px; align-self: stretch; border-radius: 99px; background: var(--muted); }
  .titles { min-width: 0; flex: 1; }
  #section { font-size: clamp(14px, 3vmin, 40px); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #title { font-size: clamp(20px, 6.5vmin, 90px); font-weight: 600; line-height: 1.1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .digits-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative; overflow: hidden; }
  #digits, #probe { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.02em; white-space: nowrap; }
  #digits { font-size: 20vh; color: var(--green); transition: color .3s; }
  #probe { position: absolute; visibility: hidden; font-size: 100px; }
  #digits.warning { color: var(--amber); }
  #digits.overtime { color: var(--red); }
  #digits.idle { color: var(--fg); }
  #digits .sec { font-size: .45em; color: var(--muted); margin-left: .05em; }

  .bar { height: 2.2vh; min-height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .25s linear, background .3s; }
  .bottom { display: flex; justify-content: space-between; align-items: baseline; margin-top: 2vh; font-size: clamp(14px, 4vmin, 56px); color: var(--muted); gap: 2vw; }
  #next { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #delay.late { color: var(--red); } #delay.early { color: var(--green); }

  #schedule { display: none; flex: 1; overflow: auto; padding: 16px; }
  body.show-schedule #schedule { display: block; }
  body.show-schedule #timer { flex: 0 0 auto; }
  body.show-schedule #timer .digits-wrap { flex: 0 0 auto; }
  body.show-schedule .digits-wrap { height: 22vh; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--card); margin-bottom: 6px; font-size: 18px; }
  .row .stripe { width: 6px; align-self: stretch; border-radius: 4px; }
  .row .t { flex: 1; min-width: 0; }
  .row .m { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .a { font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; color: var(--green); }
  .row .a.over { color: var(--red); }
  .row.song { background: transparent; color: var(--muted); font-style: italic; }
  .row.running { outline: 2px solid var(--green); }
  .row.selected { outline: 2px solid var(--accent); }

  .tools { position: fixed; right: 12px; top: 12px; display: flex; gap: 8px; opacity: .25; transition: opacity .3s; }
  .tools:hover, .tools:focus-within { opacity: 1; }
  .tools button { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font: inherit; font-size: 15px; cursor: pointer; }
  body.idle .bar { visibility: hidden; }
  @media (max-width: 700px) { #timer { padding-top: 64px; } }
  #msg { display: none; margin: 1.5vh 4vw 0; padding: 1.6vh 3vw; border-radius: 1.5vh; background: var(--amber); color: #111;
         font-weight: 700; font-size: clamp(18px, 7vmin, 110px); text-align: center; line-height: 1.15; }
  body.has-msg #msg { display: block; animation: msgIn .35s cubic-bezier(.2,1.3,.4,1); }
  @keyframes msgIn { from { opacity: 0; transform: translateY(40%); } }
  #digits { transition: color .45s ease; }
  body { transition: background-color .45s ease; }
  #ctrl { display: none; flex: 0 0 auto; background: var(--card); border-top: 1px solid var(--line); padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
  body.control #ctrl { display: block; }
  #ctrl .crow { display: flex; gap: 8px; margin-bottom: 8px; }
  #ctrl button { flex: 1; font: inherit; font-size: 18px; padding: 14px 8px; border-radius: 12px; border: 1px solid var(--line);
                 background: var(--bg); color: var(--fg); cursor: pointer; touch-action: manipulation; }
  #ctrl button:active { opacity: .7; }
  #ctrl #cToggle { flex: 2; font-weight: 700; background: #16a34a; border: 0; color: #fff; }
  #ctrl #cToggle.stop { background: #dc2626; }
  #ctrl .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #ctrl .chips button { flex: 0 0 auto; font-size: 15px; padding: 10px 12px; }
  #ctrl input { flex: 3; min-width: 0; font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  #ctrlErr { color: var(--red); font-size: 14px; min-height: 1em; }
  #pinBox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 10; align-items: center; justify-content: center; }
  body.ask-pin #pinBox { display: flex; }
  #pinBox form { background: var(--card); padding: 24px; border-radius: 16px; width: min(90vw, 340px); display: flex; flex-direction: column; gap: 12px; }
  #pinBox input { font: inherit; font-size: 28px; text-align: center; letter-spacing: .3em; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  #pinBox button { font: inherit; font-size: 18px; padding: 12px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; }
  #pinBox .cancel { background: transparent; color: var(--muted); }
  body.control .row.selectable { cursor: pointer; }
  #btnControl { display: none; }
  body.can-control #btnControl { display: inline-block; }
  #offline { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); background: var(--red); color: #fff; padding: 8px 16px; border-radius: 99px; display: none; font-size: 16px; }
  body.offline #offline { display: block; }
</style>
</head>
<body>
  <div id="hg"></div>
  <div id="offline">Connessione al PC persa… riconnessione</div>
  <section id="timer">
    <div class="top">
      <div class="chip" id="chip"></div>
      <div class="titles">
        <div id="section"></div>
        <div id="title">TimerSala</div>
      </div>
    </div>
    <div class="digits-wrap" id="digitsWrap"><span id="probe">+88:88</span><div id="digits" class="idle">--:--</div></div>
    <div class="bar"><div id="fill"></div></div>
    <div id="msg"></div>
    <div class="bottom"><span id="next"></span><span id="delay"></span></div>
  </section>
  <section id="schedule"></section>
  <section id="ctrl">
    <div class="crow">
      <button id="cPrev" type="button" aria-label="Parte precedente">⏮</button>
      <button id="cToggle" type="button">AVVIA</button>
      <button id="cNext" type="button" aria-label="Parte successiva">⏭</button>
    </div>
    <div class="crow">
      <button id="cMinus" type="button">−1 min</button>
      <button id="cPlus" type="button">+1 min</button>
    </div>
    <div class="chips" id="cPresets"></div>
    <div class="crow">
      <input id="cText" type="text" maxlength="120" placeholder="Messaggio per l'oratore" enterkeyhint="send">
      <button id="cSend" type="button">Invia</button>
      <button id="cClear" type="button">Togli</button>
    </div>
    <div id="ctrlErr"></div>
  </section>
  <div id="pinBox">
    <form id="pinForm">
      <div>Inserisci il PIN mostrato su TimerSala</div>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
      <div id="pinErr" style="color:var(--red);min-height:1em"></div>
      <button type="submit">Entra</button>
      <button type="button" class="cancel" id="pinCancel">Annulla</button>
    </form>
  </div>
  <div class="tools">
    <button id="btnControl" type="button">Controllo</button>
    <button id="btnSchedule" type="button">Programma</button>
    <button id="btnFull" type="button">Schermo intero</button>
  </div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const fmtDelay = s => { const a = Math.abs(s); return (s > 0 ? '+' : '−') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0'); };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let lastFont = null;
  let lastHasMsg = false;
  function applyStyle(st) {
    if (!st) return;
    const b = document.body.classList;
    b.toggle('theme-light', st.theme === 'light');
    b.toggle('layout-hourglass', st.layout === 'hourglass');
    b.toggle('layout-digits', st.layout === 'digitsonly');
    b.toggle('mono', !st.colored);
    b.toggle('hide-title', !st.showTitle);
    b.toggle('hide-section', !st.showSection);
    b.toggle('hide-bar', !st.showBar);
    b.toggle('flash', st.flash);
    if (st.font !== lastFont) {
      lastFont = st.font;
      document.documentElement.style.setProperty('--font', (st.font ? `"${st.font}", ` : '') + '"Bahnschrift", "Segoe UI", Roboto, system-ui, sans-serif');
      fit();
    }
  }

  function render(s) {
    applyStyle(s.style);
    const hg = $('hg');
    hg.style.width = (s.phase === 'overtime' ? 100 : (1 - s.progress) * 100) + '%';
    hg.style.background = s.phase === 'overtime' ? 'var(--red)' : s.phase === 'warning' ? 'var(--amber)' : 'var(--green)';
    document.body.classList.toggle('overtime', s.phase === 'overtime');
    document.body.classList.toggle('idle', s.phase === 'idle');
    const d = $('digits');
    d.className = s.phase;
    if (s.phase === 'idle') {
      $('section').textContent = s.meeting || '';
      $('title').textContent = s.showNext && s.next ? 'Prossima: ' + s.next : '';
      d.innerHTML = s.showClock ? esc(s.clock) : '';
      $('fill').style.width = '0';
      $('chip').style.background = 'var(--muted)';
      $('next').textContent = '';
    } else {
      $('section').textContent = s.sectionLabel || (s.mode === 'counsel' ? 'Consiglio' : s.mode === 'countdown' ? s.meeting : '');
      $('title').textContent = s.title;
      d.textContent = s.display;
      $('fill').style.width = (s.phase === 'overtime' ? 100 : s.progress * 100) + '%';
      $('fill').style.background = s.phase === 'overtime' ? 'var(--red)' : s.phase === 'warning' ? 'var(--amber)' : 'var(--green)';
      $('chip').style.background = s.sectionColor || 'var(--muted)';
      $('next').textContent = s.style?.showNext === false ? '' : s.mode === 'countdown' ? (s.next ? 'Prima parte: ' + s.next : '') : (s.next ? 'Dopo: ' + s.next : '');
    }
    document.body.classList.toggle('has-msg', !!s.message);
    $('msg').textContent = s.message || '';
    const t = $('cToggle');
    t.textContent = s.running ? 'FERMA' : 'AVVIA';
    t.classList.toggle('stop', s.running);
    if (!!s.message !== lastHasMsg) { lastHasMsg = !!s.message; fit(); }
    const dl = $('delay');
    if (s.showDelay && s.delay !== 0) {
      dl.textContent = (s.delay > 0 ? 'Ritardo ' : 'Anticipo ') + fmtDelay(s.delay);
      dl.className = s.delay > 0 ? 'late' : 'early';
    } else { dl.textContent = s.phase === 'idle' || s.style?.showClock === false ? '' : s.clock; dl.className = ''; }
  }

  async function loadSchedule() {
    if (!document.body.classList.contains('show-schedule')) return;
    try {
      const r = await fetch('/api/schedule', { cache: 'no-store' });
      const m = await r.json();
      $('schedule').innerHTML = m.parts.map((p, i) =>
        `<div class="row ${p.song ? 'song' : 'selectable'} ${p.running ? 'running' : ''} ${p.selected && !p.running ? 'selected' : ''}" data-i="${i}">
           <span class="stripe" style="background:${p.color}"></span>
           <span class="t">${p.song ? '♪ ' : ''}${esc(p.title)}</span>
           ${p.song ? '' : `<span class="m">${p.minutes} min</span><span class="a ${p.over ? 'over' : ''}">${p.actual ?? ''}</span>`}
         </div>`).join('');
    } catch { }
  }

  let es;
  function connect() {
    es = new EventSource('/api/events');
    es.onmessage = e => { document.body.classList.remove('offline'); render(JSON.parse(e.data)); };
    es.onerror = () => { document.body.classList.add('offline'); };
  }
  // adatta la dimensione delle cifre allo spazio disponibile (con qualsiasi font)
  function fit() {
    const wrap = $('digitsWrap'), probe = $('probe');
    const w = probe.offsetWidth, h = probe.offsetHeight;
    if (!w || !h) return;
    const size = Math.min(wrap.clientWidth * 0.98 / w, wrap.clientHeight * 0.98 / h) * 100;
    $('digits').style.fontSize = Math.max(16, size) + 'px';
  }
  window.addEventListener('resize', fit);
  document.fonts?.ready.then(fit);
  fit();

  connect();
  setInterval(loadSchedule, 2000);

  // ── controllo remoto ──
  let pin = null;
  try { pin = localStorage.getItem('timersala-pin'); } catch { }
  const params = new URLSearchParams(location.search);
  if (params.get('pin')) {
    pin = params.get('pin');
    try { localStorage.setItem('timersala-pin', pin); } catch { }
    history.replaceState(null, '', location.pathname);
  }

  async function send(action, value) {
    $('ctrlErr').textContent = '';
    try {
      const r = await fetch('/api/control', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin, action, value: value == null ? null : String(value) }) });
      if (r.status === 403 || r.status === 429) {
        const e = await r.json().catch(() => ({}));
        if (r.status === 403 && e.error === 'PIN errato.') { pin = null; try { localStorage.removeItem('timersala-pin'); } catch { } askPin(); }
        $('ctrlErr').textContent = e.error || 'Non autorizzato';
        $('pinErr').textContent = e.error || '';
        return false;
      }
      if (!r.ok) { $('ctrlErr').textContent = 'Errore ' + r.status; return false; }
      loadSchedule();
      return true;
    } catch { $('ctrlErr').textContent = 'PC non raggiungibile'; return false; }
  }

  function askPin() { $('pinErr').textContent = ''; $('pinInput').value = ''; document.body.classList.add('ask-pin'); setTimeout(() => $('pinInput').focus(), 50); }

  async function openControl() {
    if (!pin) { askPin(); return; }
    if (await send('check')) { document.body.classList.add('control'); document.body.classList.remove('ask-pin'); fit(); }
  }

  $('pinForm').onsubmit = async e => {
    e.preventDefault();
    pin = $('pinInput').value.trim();
    if (await send('check')) {
      try { localStorage.setItem('timersala-pin', pin); } catch { }
      document.body.classList.remove('ask-pin');
      document.body.classList.add('control');
      fit();
    }
  };
  $('pinCancel').onclick = () => document.body.classList.remove('ask-pin');
  $('btnControl').onclick = () => {
    if (document.body.classList.contains('control')) { document.body.classList.remove('control'); fit(); }
    else openControl();
  };
  $('cToggle').onclick = () => send('toggle');
  $('cPrev').onclick = () => send('previous');
  $('cNext').onclick = () => send('next');
  $('cPlus').onclick = () => send('plus');
  $('cMinus').onclick = () => send('minus');
  $('cSend').onclick = () => { const v = $('cText').value.trim(); if (v) send('message', v).then(ok => { if (ok) $('cText').value = ''; }); };
  $('cText').onkeydown = e => { if (e.key === 'Enter') $('cSend').onclick(); };
  $('cClear').onclick = () => send('clearMessage');
  $('schedule').onclick = e => {
    const row = e.target.closest('.row.selectable');
    if (row && document.body.classList.contains('control')) send('select', row.dataset.i);
  };

  fetch('/api/config', { cache: 'no-store' }).then(r => r.json()).then(c => {
    if (!c.control) return;
    document.body.classList.add('can-control');
    $('cPresets').innerHTML = '';
    for (const p of c.presets) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = p; b.onclick = () => send('message', p);
      $('cPresets').appendChild(b);
    }
    if (params.has('controllo') || params.get('pin')) openControl();
  }).catch(() => { });

  $('btnSchedule').onclick = () => { document.body.classList.toggle('show-schedule'); fit(); loadSchedule(); };
  $('btnFull').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
  };

  // impedisce lo spegnimento dello schermo su tablet e telefoni
  let lock;
  async function wake() { try { lock = await navigator.wakeLock?.request('screen'); } catch { } }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
  wake();
})();
</script>
</body>
</html>
