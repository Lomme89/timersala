name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versione da pubblicare come release (es. v1.0.0). Vuoto = solo build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/TimerSala.Tests -c Release

      - name: Numero di versione (solo per le release)
        shell: bash
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          if [[ "$tag" =~ ^v[0-9] ]]; then echo "VERSION_ARG=-p:Version=${tag#v}" >> "$GITHUB_ENV"; fi

      - name: Publish (eseguibile unico per Windows x64)
        run: dotnet publish src/TimerSala.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish ${{ env.VERSION_ARG }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimerSala-win-x64
          path: publish/TimerSala.exe

      - name: Note di rilascio (da CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        run: .github/scripts/release-notes.sh "${{ inputs.release_tag || github.ref_name }}" > release-notes.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: TimerSala ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: publish/TimerSala.exe
