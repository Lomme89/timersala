<style>
  :root {
    --bg: #000; --fg: #f4f5f7; --muted: #8b919c; --card: #15171c; --card2: #1d2027; --line: #262a32;
    --green: #22c55e; --amber: #fbbf24; --red: #ef4444; --accent: #3b82f6;
    --font: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
    --ui: "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  body.theme-light {
    --bg: #fff; --fg: #111827; --muted: #4b5563; --card: #f3f4f6; --card2: #e9ebef; --line: #e5e7eb;
    --green: #15803d; --amber: #b45309; --red: #b91c1c;
  }
  * { box-sizing: border-box; }
  /* aree sicure: barra di stato e indicatore Home quando è installata sulla schermata Home (iPad, iPhone) */
  :root { --sa-t: env(safe-area-inset-top, 0px); --sa-r: env(safe-area-inset-right, 0px); --sa-b: env(safe-area-inset-bottom, 0px); --sa-l: env(safe-area-inset-left, 0px); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
  body { display: flex; transition: background-color .45s ease; -webkit-tap-highlight-color: transparent; }
  body.overtime { background: #1d0505; }
  body.theme-light.overtime { background: #fde2e2; }
  svg { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ── timer ── */
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: calc(3vh + var(--sa-t)) calc(4vw + var(--sa-r)) calc(2.5vh + var(--sa-b)) calc(4vw + var(--sa-l)); position: relative; z-index: 1; }
  .top { display: flex; align-items: center; gap: 1.5vw; min-height: 11vh; padding-right: var(--toolbar-w, 220px); }   /* spazio per la barra strumenti, misurata */
  .chip { width: 1.1vmin; min-width: 6px; align-self: stretch; border-radius: 99px; background: var(--muted); }
  .titles { min-width: 0; flex: 1; }
  #section { font-size: clamp(12px, 2.8vmin, 40px); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #title { font-size: clamp(18px, 6.2vmin, 90px); font-weight: 600; line-height: 1.1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .digits-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative; overflow: hidden; }
  #digits, #probe { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.02em; white-space: nowrap; }
  #digits { font-size: 20vh; color: var(--green); transition: color .45s ease; }
  #digits.warning { color: var(--amber); }
  #digits.overtime { color: var(--red); }
  #digits.idle { color: var(--fg); }
  #probe { position: absolute; visibility: hidden; font-size: 100px; }
  .bar { height: 2vh; min-height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .25s linear, background .3s; }
  .bottom { display: flex; justify-content: space-between; align-items: baseline; margin-top: 1.6vh; font-size: clamp(13px, 3.8vmin, 56px); color: var(--muted); gap: 2vw; }
  #next { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #delay.late { color: var(--red); } #delay.early { color: var(--green); }
  #msg { display: none; margin-top: 1.6vh; padding: 1.4vh 3vw; border-radius: 1.4vh; background: #fbbf24; color: #111;
         font-weight: 700; font-size: clamp(16px, 6.5vmin, 110px); text-align: center; line-height: 1.15; }
  body.has-msg #msg { display: block; animation: msgIn .35s cubic-bezier(.2,1.3,.4,1); }
  @keyframes msgIn { from { opacity: 0; transform: translateY(40%); } }
  #hg { position: fixed; left: 0; top: 0; bottom: 0; width: 0; background: var(--green); opacity: .45; display: none; transition: width .25s linear, background .3s; }
  body.layout-hourglass:not(.idle):not(.panel) #hg { display: block; }
  body.layout-hourglass .bar, body.layout-digits .bar, body.layout-digits .top, body.layout-digits .bottom { display: none; }
  body.layout-hourglass #digits { color: var(--fg) !important; }
  body.mono #digits:not(.idle) { color: var(--fg); }
  body.hide-title #title, body.hide-section #section, body.hide-section .chip, body.hide-bar .bar, body.idle .bar { visibility: hidden; }
  body.flash.overtime #digits { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ── conto alla rovescia prima dell'adunanza: stili alternativi ── */
  #cd { position: absolute; inset: 0; display: none; z-index: 2; overflow: hidden; }
  body.cd-on #cd { display: block; }
  #cd > div { position: absolute; inset: 0; display: none; }
  body.show-ring #cd .cd-ring, body.show-blocks #cd .cd-blocks, body.show-clock #cd .cd-clock, body.show-tide #cd .cd-tide, body.show-dial #cd .cd-dial, body.show-words #cd .cd-words { display: block; }
  .cd-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cd-l { font: 600 clamp(11px, 3.4vmin, 34px) var(--ui); letter-spacing: .22em; }
  .cd-d { font-weight: 700; font-variant-numeric: tabular-nums; line-height: .95; white-space: nowrap; }
  .cd-ring { background: radial-gradient(110% 90% at 50% 30%, #14324d 0%, #0a1724 60%, #060d15 100%); color: #e8f1f8; }
  .cd-ring svg { position: absolute; left: 50%; top: 50%; width: 84vmin; height: 84vmin; transform: translate(-50%, -50%) rotate(-90deg); stroke: none; fill: none; }
  .cd-ring .cd-d { font-size: 26vmin; }
  .cd-ring .cd-l { color: #7fb3d5; } .cd-ring .dim { color: #5f8fb0; margin-top: 1vmin; }
  .cd-blocks { background: #0d0f12; color: #f1ece3; }
  .cd-blocks .cd-l { position: absolute; left: 9vw; top: 9vh; color: #7fb3d5; }
  .cd-blocks .cd-d { position: absolute; inset: 0; display: grid; place-items: center; font-size: min(55vh, 30vw); padding-bottom: 4vh; }
  .cd-blk { position: absolute; left: 9vw; right: 9vw; bottom: 9vh; height: max(10px, 4vh); display: flex; gap: max(6px, 2.4vh); }
  .cd-blk i { flex: 1; background: #2a2d33; position: relative; overflow: hidden; }
  .cd-blk i b { position: absolute; left: 0; top: 0; bottom: 0; background: #7fb3d5; }
  .cd-clock { background: #0b0b0c; color: #f4f5f7; }
  .cd-clock .cd-d { font-size: min(44vh, 19vw); }
  .cd-clock .cd-d small { font-size: .48em; color: #55606e; }
  .cd-note { font: 400 clamp(14px, 6.5vmin, 64px) var(--ui); color: #9aa6b3; margin-top: 1vh; }
  .cd-tide { background: #071018; color: #eaf4fa; }
  .tide { position: absolute; left: 0; right: 0; bottom: 0; height: 3%; background: linear-gradient(#1d5a78, #123a52); transition: height 1s linear; }
  .tide svg { position: absolute; left: 0; bottom: 100%; width: 200%; height: 3vh; fill: #1d5a78; stroke: none; animation: tide 7s linear infinite; margin-bottom: -1px; }
  @keyframes tide { to { transform: translateX(-50%); } }
  .cd-tide .cd-d { font-size: min(47vh, 25vw); }
  .cd-tide .cd-l { color: #a8d0e6; }
  .cd-dial { background: #0a0e14; color: #e8f1f8; }
  .cd-dial svg { position: absolute; left: 50%; top: 50%; width: 90vmin; height: 90vmin; transform: translate(-50%, -50%); fill: none; }
  .cd-dial line { stroke: #253445; stroke-linecap: round; stroke-width: 1.6; }
  .cd-dial line.major { stroke-width: 2.4; }
  .cd-dial line.on { stroke: #e8f1f8; }
  .cd-dial .cd-d { font-size: 40vmin; line-height: .8; }
  .cd-dial .cd-l { color: #7fb3d5; margin-top: 2vmin; }
  .cd-words { background: #0c0c0d; color: #f4f5f7; }
  .cd-words .cd-s { font: 300 min(15vh, 8.6vw) var(--ui); color: #d9d3c8; }
  .cd-words .cd-d { font-size: min(32vh, 14vw); }

  /* ── messaggio a tutto schermo ── */
  /* modalità addestramento: impossibile scambiarla per l'adunanza vera */
  #training { display: none; position: fixed; left: 50%; bottom: calc(10px + var(--sa-b)); transform: translateX(-50%); z-index: 6;
              background: #fbbf24; color: #111; font: 700 clamp(12px, 2.4vmin, 22px) var(--ui); letter-spacing: .2em; padding: .35em 1.1em; border-radius: 99px; white-space: nowrap; }
  body.training #training { display: block; }
  body.training #stage { padding-bottom: calc(2.5vh + clamp(12px, 2.4vmin, 22px) * 2.6 + 14px + var(--sa-b)); }
  body.training { box-shadow: inset 0 0 0 4px #fbbf24; }
  #msgFull { position: absolute; inset: 0; z-index: 3; display: none; background: #fbbf24; color: #111; }
  body.msg-full #msgFull { display: flex; animation: fullIn .38s cubic-bezier(.2,1.3,.4,1); }
  @keyframes fullIn { from { opacity: 0; transform: scale(1.06); } }
  #msgFullText { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 5vh 5vw 14vh;
                 font: 700 20vh/1.05 var(--ui); overflow-wrap: anywhere; }
  #msgFullClock { position: absolute; right: calc(3vw + var(--sa-r)); bottom: calc(2.5vh + var(--sa-b)); font-size: 9vh; font-weight: 700; font-variant-numeric: tabular-nums; opacity: .7; }
  body.msg-full:not(.panel) #msg { display: none !important; }
  body.panel.msg-full #msgFull { display: none; }   /* col pannello aperto il timer è una striscia: basta la fascia */
  .fullToggle { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line);
                background: var(--bg); color: var(--fg); font: 600 14px var(--ui); cursor: pointer; }
  .fullToggle svg { width: 18px; height: 18px; }
  .fullToggle[aria-pressed="true"] { background: #fbbf24; border-color: #fbbf24; color: #111; }

  /* ── barra strumenti ── */
  .toolbar { position: fixed; right: calc(12px + var(--sa-r)); top: calc(12px + var(--sa-t)); z-index: 5; display: flex; gap: 6px; opacity: .35; transition: opacity .3s; }
  .toolbar:hover, .toolbar:focus-within, body.panel .toolbar, body.look-open .toolbar { opacity: 1; }
  #lookMenu { display: none; position: fixed; right: calc(12px + var(--sa-r)); top: calc(56px + var(--sa-t)); z-index: 8; width: min(300px, calc(100vw - 24px));
              background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; font-family: var(--ui); box-shadow: 0 12px 32px rgba(0,0,0,.35); }
  body.look-open #lookMenu { display: block; }
  #lookMenu .lookTitle { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 8px; }
  #lookMenu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: 15px var(--ui); color: var(--fg);
                     background: transparent; border: 0; border-radius: 10px; padding: 11px 10px; cursor: pointer; }
  #lookMenu button::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
  #lookMenu button[aria-checked="true"]::before { background: var(--accent); border-color: var(--accent); }
  #lookMenu button:hover { background: var(--card2); }
  .tbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--card); color: var(--fg); border: 1px solid var(--line);
          border-radius: 10px; padding: 8px 12px; font: 14px var(--ui); cursor: pointer; }
  .tbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tbtn span { white-space: nowrap; }
  @media (max-width: 440px) { .tbtn span { display: none; } }   /* sul telefono solo le icone: ci stanno tutte */
  #btnControl { display: none; }
  body.no-full #btnFull { display: none; }
  #toast { position: fixed; left: 50%; top: calc(64px + var(--sa-t)); transform: translate(-50%, -12px); background: var(--card); color: var(--fg); border: 1px solid var(--line);
           padding: 10px 18px; border-radius: 99px; font: 15px var(--ui); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #wakeVideo { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  body.can-control #btnControl { display: inline-flex; }

  /* ── pannello (programma / controllo) ── */
  #panel { display: none; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; padding: calc(64px + var(--sa-t)) calc(16px + var(--sa-r)) calc(16px + var(--sa-b)) 16px; background: var(--card2);
           border-left: 1px solid var(--line); font-family: var(--ui); position: relative; z-index: 2; }
  body.panel #panel { display: flex; }
  /* orizzontale: timer a sinistra, pannello a destra */
  @media (min-aspect-ratio: 1/1) {
    body.panel #panel { width: min(440px, 42vw); }
    body.panel .top { padding-right: 0; }
  }
  /* verticale (telefono): timer compatto sopra, pannello sotto */
  @media (max-aspect-ratio: 1/1) {
    body.panel { flex-direction: column; }
    body.panel #stage { flex: 0 0 auto; height: 38vh; padding: calc(58px + var(--sa-t)) calc(16px + var(--sa-r)) 10px calc(16px + var(--sa-l)); }
    body.panel .top { min-height: 0; padding: 0; }
    body.panel #section { display: none; }
    body.panel .bottom { display: none; }
    body.panel #msg { font-size: clamp(14px, 4.5vmin, 32px); padding: 6px 12px; margin-top: 8px; border-radius: 10px; }
    body.panel #panel { flex: 1; padding: 12px calc(16px + var(--sa-r)) calc(16px + var(--sa-b)) calc(16px + var(--sa-l)); border-left: 0; border-top: 1px solid var(--line); }
    .top { padding-right: 0; padding-top: 44px; }
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  .card h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600;
             display: flex; align-items: center; gap: 8px; }
  .row { display: flex; gap: 8px; }
  .row + .row { margin-top: 8px; }
  .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 17px var(--ui);
         padding: 14px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
         cursor: pointer; touch-action: manipulation; transition: transform .08s, background .2s; }
  .btn:active { transform: scale(.96); }
  .btn svg { width: 22px; height: 22px; }
  .btn.play { flex: 2; background: #16a34a; border-color: #16a34a; color: #fff; font-size: 19px; }
  .btn.play.stop { background: #dc2626; border-color: #dc2626; }
  .btn.small { flex: 0 0 auto; padding: 12px 14px; }

  .tabs { display: none; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
  body.control.msgs .tabs { display: flex; }
  .tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border: 0; border-radius: 9px;
         background: transparent; color: var(--muted); font: 600 15px var(--ui); cursor: pointer; }
  .tab.on { background: var(--card2); color: var(--fg); }

  #transport { display: none; }
  body.control #transport { display: block; }
  #list { display: flex; flex-direction: column; gap: 6px; }
  .part { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; background: var(--card); border: 1px solid transparent; font-size: 15px; }
  .part .stripe { width: 5px; align-self: stretch; border-radius: 4px; }
  .part .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .part .m { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
  .part .a { font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; color: var(--green); font-size: 14px; }
  .part .a.over { color: var(--red); }
  .part .vid { display: inline-block; font-size: .7em; color: var(--amber); margin-right: 6px; vertical-align: .12em; }
  .part.song { background: transparent; color: var(--muted); font-style: italic; padding: 4px 12px; font-size: 14px; }
  .part.running { border-color: var(--green); background: color-mix(in srgb, var(--green) 12%, var(--card)); }
  .part.selected { border-color: var(--accent); }
  body.control .part:not(.song) { cursor: pointer; }
  body.control .part:not(.song):active { transform: scale(.98); }
  .hint { font-size: 13px; color: var(--muted); margin: 2px 2px 0; }

  #msgCard { display: none; border-color: color-mix(in srgb, #fbbf24 45%, var(--line)); }
  #msgCard h2 { color: #fbbf24; }
  #onAir { display: none; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 10px; border-radius: 12px; background: #fbbf24; color: #111; font-weight: 700; }
  #onAir .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #onAir button { border: 0; background: rgba(0,0,0,.15); color: #111; border-radius: 9px; padding: 8px 10px; font: 600 14px var(--ui); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  body.has-msg #onAir { display: flex; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chips button { font: 15px var(--ui); padding: 10px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  .chips button:active { transform: scale(.95); }
  .compose { display: flex; gap: 8px; }
  .compose input { flex: 1; min-width: 0; font: 16px var(--ui); padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .compose input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #ctrlErr { color: var(--red); font-size: 14px; min-height: 1em; }

  /* visibilità delle sezioni del pannello */
  body.control.tab-msgs #scheduleCard { display: none; }
  body.control.tab-msgs #msgCard { display: block; }

  #pinBox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 10; align-items: center; justify-content: center; font-family: var(--ui); }
  body.ask-pin #pinBox { display: flex; }
  #pinBox form { background: var(--card); border: 1px solid var(--line); padding: 24px; border-radius: 18px; width: min(90vw, 340px); display: flex; flex-direction: column; gap: 12px; }
  #pinBox h3 { margin: 0; font-size: 18px; }
  #pinBox input { font: 28px var(--font); text-align: center; letter-spacing: .3em; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  #pinBox .go { font: 600 17px var(--ui); padding: 12px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  #pinBox .cancel { font: 15px var(--ui); background: transparent; border: 0; color: var(--muted); cursor: pointer; }
  #offline { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); background: var(--red); color: #fff; padding: 8px 16px; border-radius: 99px; display: none; font: 15px var(--ui); z-index: 20; }
  body.offline #offline { display: block; }
  /* «riduci movimento» del telefono o del PC: niente animazioni né lampeggi, solo i cambi di stato */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <svg style="display:none" aria-hidden="true">
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 5 9 12l10 7V5z"/><path d="M5 5v14"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7V5z"/><path d="M19 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5-12-7.5z" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
    <symbol id="i-remote" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><circle cx="12" cy="8" r="2"/><path d="M10 14h.01M14 14h.01M10 17.5h.01M14 17.5h.01"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-wake" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14"/><path d="m21 3-7 18-4-7-7-4 18-7z"/></symbol>
    <symbol id="i-look" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-msg" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>

  <div id="hg"></div>
  <div id="offline">Connessione al PC persa… riconnessione</div>
  <div id="toast" role="status"></div>

  <div id="training">PROVA · ADDESTRAMENTO</div>
  <main id="stage">
    <div class="top">
      <div class="chip" id="chip"></div>
      <div class="titles">
        <div id="section"></div>
        <div id="title">TimerSala</div>
      </div>
    </div>
    <div class="digits-wrap" id="digitsWrap"><span id="probe">+88:88</span><div id="digits" class="idle">--:--</div></div>
    <div class="bar"><div id="fill"></div></div>
    <div id="msg"></div>
    <div class="bottom"><span id="next"></span><span id="delay"></span></div>
    <div id="msgFull" aria-live="polite"><div id="msgFullText"><span id="msgFullInner"></span></div><div id="msgFullClock"></div></div>
    <div id="cd" aria-hidden="true">
      <div class="cd-ring">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" stroke="#1c3a55" stroke-width="2.4"/><circle id="cdArc" cx="50" cy="50" r="47" stroke="#7fb3d5" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="295.3" stroke-dashoffset="0"/></svg>
        <div class="cd-c"><div class="cd-l">INIZIA TRA</div><div class="cd-d" data-cd="digits"></div><div class="cd-l dim" data-cd="startLabel"></div></div>
      </div>
      <div class="cd-blocks"><div class="cd-l">L'ADUNANZA INIZIA TRA</div><div class="cd-d" data-cd="digits"></div><div class="cd-blk" id="cdBlk"></div></div>
      <div class="cd-clock"><div class="cd-c"><div class="cd-d"><span data-cd="clock"></span><small data-cd="clockSec"></small></div><div class="cd-note" data-cd="clockNote"></div></div></div>
      <div class="cd-tide">
        <div class="tide" id="cdTide"><svg viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M0 6 Q12.5 1 25 6 T50 6 T75 6 T100 6 T125 6 T150 6 T175 6 T200 6 V10 H0 Z"/></svg></div>
        <div class="cd-c"><div class="cd-l">INIZIA TRA</div><div class="cd-d" data-cd="digits"></div></div>
      </div>
      <div class="cd-dial"><svg id="cdDial" viewBox="0 0 100 100"></svg><div class="cd-c"><div class="cd-d" data-cd="dialBig"></div><div class="cd-l" data-cd="dialUnit"></div></div></div>
      <div class="cd-words"><div class="cd-c"><div class="cd-s">si comincia tra</div><div class="cd-d" data-cd="words"></div></div></div>
    </div>
  </main>

  <aside id="panel">
    <section class="card" id="transport">
      <div class="row">
        <button class="btn small" id="cPrev" type="button" aria-label="Parte precedente"><svg><use href="#i-prev"/></svg></button>
        <button class="btn play" id="cToggle" type="button"><svg><use href="#i-play"/></svg><span>AVVIA</span></button>
        <button class="btn small" id="cNext" type="button" aria-label="Parte successiva"><svg><use href="#i-next"/></svg></button>
      </div>
      <div class="row">
        <button class="btn" id="cMinus" type="button"><svg><use href="#i-minus"/></svg>1 min</button>
        <button class="btn" id="cPlus" type="button"><svg><use href="#i-plus"/></svg>1 min</button>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab on" id="tabSchedule" type="button"><svg><use href="#i-list"/></svg>Programma</button>
      <button class="tab" id="tabMsgs" type="button"><svg><use href="#i-msg"/></svg>Messaggi</button>
    </nav>

    <section id="scheduleCard">
      <div id="list"></div>
      <p class="hint" id="listHint"></p>
    </section>

    <section class="card" id="msgCard">
      <h2><svg><use href="#i-msg"/></svg>Messaggio all'oratore</h2>
      <div id="onAir"><span class="txt" id="onAirText"></span><button type="button" id="cClear"><svg><use href="#i-x"/></svg>Togli</button></div>
      <button type="button" class="fullToggle" id="cFull" aria-pressed="false"><svg><use href="#i-full"/></svg>A tutto schermo</button>
      <div class="chips" id="cPresets"></div>
      <div class="compose">
        <input id="cText" type="text" maxlength="120" placeholder="Scrivi un messaggio…" enterkeyhint="send" autocomplete="off">
        <button class="btn small" id="cSend" type="button" aria-label="Invia"><svg><use href="#i-send"/></svg></button>
      </div>
    </section>

    <div id="ctrlErr"></div>
  </aside>

  <div class="toolbar">
    <button class="tbtn" id="btnSchedule" type="button"><svg><use href="#i-list"/></svg><span>Programma</span></button>
    <button class="tbtn" id="btnControl" type="button"><svg><use href="#i-remote"/></svg><span>Controllo</span></button>
    <button class="tbtn" id="btnLook" type="button" aria-label="Aspetto di questo dispositivo" title="Aspetto di questo dispositivo" aria-haspopup="true"><svg><use href="#i-look"/></svg></button>
    <button class="tbtn" id="btnWake" type="button" aria-label="Schermo sempre acceso" title="Schermo sempre acceso"><svg><use href="#i-wake"/></svg></button>
    <button class="tbtn" id="btnFull" type="button" aria-label="Schermo intero" title="Schermo intero"><svg><use href="#i-full"/></svg></button>
  </div>

  <!-- aspetto scelto per questo dispositivo (ricordato dal browser) -->
  <div id="lookMenu" role="menu" aria-label="Aspetto di questo dispositivo">
    <div class="lookTitle">Su questo dispositivo</div>
    <button type="button" role="menuitemradio" data-look="pc">Come sullo schermo della sala</button>
    <button type="button" role="menuitemradio" data-look="digits">Solo le cifre, grandissime</button>
    <button type="button" role="menuitemradio" data-look="classic">Classico: titolo, cifre e barra</button>
    <button type="button" role="menuitemradio" data-look="schedule">Con il programma accanto</button>
  </div>

  <div id="pinBox">
    <form id="pinForm">
      <h3>Controllo del timer</h3>
      <div style="color:var(--muted);font-size:14px">Inserisci il PIN mostrato su TimerSala (Impostazioni → Rete e telefono).</div>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
      <div id="pinErr" style="color:var(--red);min-height:1em;font-size:14px"></div>
      <button class="go" type="submit">Entra</button>
      <button type="button" class="cancel" id="pinCancel">Annulla</button>
    </form>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const B = document.body.classList;
  const fmtDelay = s => { const a = Math.abs(s); return (s > 0 ? '+' : '−') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0'); };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // il titolo lascia alla barra strumenti lo spazio che occupa davvero (con le etichette è ben più dei 220px di prima)
  const toolbar = document.querySelector('.toolbar');
  new ResizeObserver(() => document.documentElement.style.setProperty('--toolbar-w', (toolbar.offsetWidth + 16) + 'px')).observe(toolbar);

  // ── dimensione cifre adattata allo spazio disponibile ──
  function fit() {
    const wrap = $('digitsWrap'), probe = $('probe');
    const w = probe.offsetWidth, h = probe.offsetHeight;
    if (!w || !h || !wrap.clientWidth) return;
    const size = Math.min(wrap.clientWidth * 0.98 / w, wrap.clientHeight * 0.98 / h) * 100;
    $('digits').style.fontSize = Math.max(16, size) + 'px';
  }
  window.addEventListener('resize', fit);
  document.fonts?.ready.then(fit);

  // ── stile scelto sul PC ──
  let lastFont = null;
  // aspetto di questo dispositivo: «pc» segue lo schermo della sala, gli altri valgono solo qui
  let look = 'pc';
  try { look = localStorage.getItem('timersala-aspetto') || 'pc'; } catch { }
  let lastStyle = null;
  function applyStyle(st) {
    if (!st) return;
    lastStyle = st;
    if (look === 'digits') st = { ...st, layout: 'digitsonly' };
    else if (look === 'classic' || look === 'schedule') st = { ...st, layout: 'classic', showTitle: true, showBar: true };
    B.toggle('theme-light', st.theme === 'light');
    B.toggle('layout-hourglass', st.layout === 'hourglass');
    B.toggle('layout-digits', st.layout === 'digitsonly');
    B.toggle('mono', !st.colored);
    B.toggle('hide-title', !st.showTitle);
    B.toggle('hide-section', !st.showSection);
    B.toggle('hide-bar', !st.showBar);
    B.toggle('flash', st.flash);
    if (st.font !== lastFont) {
      lastFont = st.font;
      document.documentElement.style.setProperty('--font', (st.font ? `"${st.font}", ` : '') + '"Bahnschrift", "Segoe UI", Roboto, system-ui, sans-serif');
      fit();
    }
  }

  // ── stato in tempo reale ──
  let lastHasMsg = false, lastSchedule = '';
  // ── conto alla rovescia: stili alternativi (stessa logica dello schermo del timer) ──
  const CD_STYLES = ['ring', 'blocks', 'clock', 'tide', 'dial', 'words'];
  const dialTicks = [];
  for (let i = 0; i < 60; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 30, major = i % 5 === 0, r1 = major ? 42 : 45, r2 = 49;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 50 + r1 * Math.cos(a)); l.setAttribute('y1', 50 + r1 * Math.sin(a));
    l.setAttribute('x2', 50 + r2 * Math.cos(a)); l.setAttribute('y2', 50 + r2 * Math.sin(a));
    if (major) l.classList.add('major');
    $('cdDial').appendChild(l); dialTicks.push(l);
  }
  let cdBlocks = 0;
  function renderCountdown(s) {
    const style = s.style?.countdown || 'classic';
    const on = s.mode === 'countdown' && CD_STYLES.includes(style);
    B.toggle('cd-on', on);
    CD_STYLES.forEach(c => B.toggle('show-' + c, on && style === c));
    if (!on) return;
    const rem = Math.max(0, s.remaining ?? 0), secs = Math.ceil(rem - 0.0001), target = s.target || 300;
    const left = Math.max(0, Math.min(1, rem / target));
    const words = secs > 60 ? Math.ceil(secs / 60) + ' MINUTI' : secs === 1 ? '1 SECONDO' : secs + ' SECONDI';
    let dialBig, dialUnit, lit;
    if (secs > 60) { const m = Math.floor(secs / 60), r = secs % 60, mm = r === 0 ? m - 1 : m; dialBig = mm; dialUnit = mm === 1 ? 'MINUTO' : 'MINUTI'; lit = r === 0 ? 60 : r; }
    else { dialBig = secs; dialUnit = secs === 1 ? 'SECONDO' : 'SECONDI'; lit = secs; }
    const v = {
      digits: Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'),
      startLabel: s.startsAt ? 'ALLE ' + s.startsAt : '',
      clock: s.clock, clockSec: ':' + s.seconds,
      clockNote: (s.startsAt ? 'si comincia alle ' + s.startsAt + ' · ' : 'si comincia ') + 'tra ' + words.toLowerCase(),
      dialBig, dialUnit, words,
    };
    document.querySelectorAll('[data-cd]').forEach(e => { const t = String(v[e.dataset.cd] ?? ''); if (e.textContent !== t) e.textContent = t; });
    $('cdArc').setAttribute('stroke-dashoffset', (295.3 * (1 - left)).toFixed(2));
    $('cdTide').style.height = Math.max(3, (1 - left) * 100) + '%';
    dialTicks.forEach((l, i) => l.classList.toggle('on', i < lit));
    const n = Math.max(1, Math.min(10, Math.ceil(target / 60)));
    if (n !== cdBlocks) { $('cdBlk').innerHTML = '<i><b></b></i>'.repeat(n); cdBlocks = n; }
    [...$('cdBlk').children].forEach((el, i) => el.firstChild.style.width = Math.max(0, Math.min(1, left * n - i)) * 100 + '%');
  }

  // il testo a tutto schermo si rimpicciolisce finché non entra
  let lastFull = '';
  function fitFull() {
    const box = $('msgFullText'), inner = $('msgFullInner'), cs = getComputedStyle(box);
    const h = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const w = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    let size = 20;
    box.style.fontSize = size + 'vh';
    while (size > 3 && (inner.offsetHeight > h || inner.offsetWidth > w)) { size -= .5; box.style.fontSize = size + 'vh'; }
  }
  function renderFull(s) {
    const on = !!(s.messageFull && s.message);
    B.toggle('msg-full', on);
    if (!on) { lastFull = ''; return; }
    $('msgFullClock').textContent = s.phase === 'idle' ? s.clock : s.display;
    if (s.message !== lastFull) { lastFull = s.message; $('msgFullInner').textContent = s.message; requestAnimationFrame(fitFull); }
  }
  addEventListener('resize', () => { if (lastFull) fitFull(); });

  function render(s) {
    applyStyle(s.style);
    renderCountdown(s);
    renderFull(s);
    B.toggle('training', !!s.training);
    B.toggle('overtime', s.phase === 'overtime');
    B.toggle('idle', s.phase === 'idle');
    const hg = $('hg');
    hg.style.width = (s.phase === 'overtime' ? 100 : (1 - s.progress) * 100) + '%';
    hg.style.background = s.phase === 'overtime' ? 'var(--red)' : s.phase === 'warning' ? 'var(--amber)' : 'var(--green)';

    const d = $('digits');
    d.className = s.phase;
    if (s.phase === 'idle') {
      $('section').textContent = s.meeting || '';
      $('title').textContent = s.showNext && s.next ? 'Prossima: ' + s.next : '';
      d.textContent = s.showClock ? s.clock : '';
      $('fill').style.width = '0';
      $('chip').style.background = 'var(--muted)';
      $('next').textContent = '';
    } else {
      $('section').textContent = s.sectionLabel || (s.mode === 'counsel' ? 'Consiglio' : s.mode === 'countdown' ? s.meeting : '');
      $('title').textContent = s.title;
      d.textContent = s.display;
      $('fill').style.width = (s.phase === 'overtime' ? 100 : s.progress * 100) + '%';
      $('fill').style.background = s.phase === 'overtime' ? 'var(--red)' : s.phase === 'warning' ? 'var(--amber)' : 'var(--green)';
      $('chip').style.background = s.sectionColor || 'var(--muted)';
      $('next').textContent = s.style?.showNext === false ? '' : s.mode === 'countdown' ? (s.next ? 'Prima parte: ' + s.next : '') : (s.next ? 'Dopo: ' + s.next : '');
    }
    const dl = $('delay');
    if (s.showDelay && s.delay !== 0) {
      dl.textContent = (s.delay > 0 ? 'Ritardo ' : 'Anticipo ') + fmtDelay(s.delay);
      dl.className = s.delay > 0 ? 'late' : 'early';
    } else { dl.textContent = s.phase === 'idle' || s.style?.showClock === false ? '' : s.clock; dl.className = ''; }

    B.toggle('has-msg', !!s.message);
    $('msg').textContent = s.message || '';
    $('onAirText').textContent = s.message ? 'Sullo schermo: ' + s.message : '';
    if (!!s.message !== lastHasMsg) { lastHasMsg = !!s.message; fit(); }

    const t = $('cToggle');
    t.classList.toggle('stop', s.running);
    t.innerHTML = s.running ? '<svg><use href="#i-stop"/></svg><span>FERMA</span>' : '<svg><use href="#i-play"/></svg><span>AVVIA</span>';
  }

  // ── programma ──
  async function loadSchedule() {
    if (!B.contains('panel')) return;
    try {
      const r = await fetch('/api/schedule', { cache: 'no-store' });
      const m = await r.json();
      const html = m.parts.map((p, i) =>
        `<div class="part ${p.song ? 'song' : ''} ${p.running ? 'running' : ''} ${p.selected && !p.running ? 'selected' : ''}" data-i="${i}">
           ${p.song ? '♪' : `<span class="stripe" style="background:${p.color}"></span>`}
           <span class="t">${p.video ? '<span class="vid" title="Parte con un video">▶</span>' : ''}${esc(p.title)}</span>
           ${p.song ? '' : `<span class="m">${p.minutes}′</span><span class="a ${p.over ? 'over' : ''}">${p.actual ?? ''}</span>`}
         </div>`).join('');
      if (html !== lastSchedule) { $('list').innerHTML = html; lastSchedule = html; }
      $('listHint').textContent = B.contains('control') ? 'Tocca una parte per selezionarla.' : '';
    } catch { }
  }
  setInterval(loadSchedule, 1500);

  // ── modalità del pannello ──
  function setPanel(mode) {           // null | 'schedule' | 'control'
    B.toggle('panel', !!mode);
    B.toggle('control', mode === 'control');
    $('btnSchedule').classList.toggle('on', mode === 'schedule');
    $('btnControl').classList.toggle('on', mode === 'control');
    if (mode !== 'control') setTab('schedule');
    lastSchedule = '';
    loadSchedule();
    requestAnimationFrame(fit);
  }
  function setTab(tab) {
    B.toggle('tab-msgs', tab === 'msgs');
    $('tabSchedule').classList.toggle('on', tab !== 'msgs');
    $('tabMsgs').classList.toggle('on', tab === 'msgs');
  }
  $('btnSchedule').onclick = () => setPanel(B.contains('panel') && !B.contains('control') ? null : 'schedule');
  $('btnControl').onclick = () => B.contains('control') ? setPanel(null) : openControl();
  $('tabSchedule').onclick = () => setTab('schedule');
  $('tabMsgs').onclick = () => setTab('msgs');

  // ── schermo intero (manuale: il browser lo concede solo dopo un tocco) ──
  const root = document.documentElement;
  const fullEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const canFull = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  B.toggle('no-full', !canFull);   // iPhone: non supportato, si usa «Aggiungi a Home»
  $('btnFull').onclick = () => {
    if (fullEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (root.requestFullscreen || root.webkitRequestFullscreen).call(root)?.catch?.(() => toast('Schermo intero non disponibile'));
  };
  const onFull = () => { $('btnFull').classList.toggle('on', !!fullEl()); requestAnimationFrame(fit); };
  document.addEventListener('fullscreenchange', onFull);
  document.addEventListener('webkitfullscreenchange', onFull);

  // ── controllo remoto ──
  let pin = null;
  try { pin = localStorage.getItem('timersala-pin'); } catch { }
  const params = new URLSearchParams(location.search);
  if (params.get('pin')) {
    pin = params.get('pin');
    try { localStorage.setItem('timersala-pin', pin); } catch { }
    history.replaceState(null, '', location.pathname);
  }

  // dispositivo fidato: dopo il primo PIN il PC dà a questo telefono un suo codice, revocabile dal PC
  let token = null;
  try { token = localStorage.getItem('timersala-token'); } catch { }
  function forget() {
    pin = null; token = null;
    try { localStorage.removeItem('timersala-pin'); localStorage.removeItem('timersala-token'); } catch { }
  }

  async function send(action, value) {
    $('ctrlErr').textContent = '';
    try {
      const r = await fetch('/api/control', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: token ? null : pin, token, action, value: value == null ? null : String(value) }) });
      const e = await r.json().catch(() => ({}));
      if (r.status === 403 && e?.code === 'auth') {
        forget();
        connect();
        $('pinErr').textContent = e.error;
        askPin();
        return false;
      }
      if (!r.ok) { $('ctrlErr').textContent = e?.error || 'Errore ' + r.status; $('pinErr').textContent = e?.error || ''; return false; }
      if (e?.token) {
        token = e.token; pin = null;
        try { localStorage.setItem('timersala-token', token); localStorage.removeItem('timersala-pin'); } catch { }
        connect();
      }
      navigator.vibrate?.(15);
      loadSchedule();
      return true;
    } catch { $('ctrlErr').textContent = 'PC non raggiungibile'; return false; }
  }

  function askPin() { $('pinInput').value = ''; B.add('ask-pin'); setTimeout(() => $('pinInput').focus(), 50); }
  async function openControl() {
    if (!pin && !token) { $('pinErr').textContent = ''; askPin(); return; }
    if (await send('check')) { B.remove('ask-pin'); setPanel('control'); }
  }
  $('pinForm').onsubmit = async e => {
    e.preventDefault();
    pin = $('pinInput').value.trim();
    token = null;
    if (await send('check')) {
      B.remove('ask-pin');
      setPanel('control');
    }
  };
  $('pinCancel').onclick = () => B.remove('ask-pin');

  $('cToggle').onclick = () => send('toggle');
  $('cPrev').onclick = () => send('previous');
  $('cNext').onclick = () => send('next');
  $('cPlus').onclick = () => send('plus');
  $('cMinus').onclick = () => send('minus');
  $('cClear').onclick = () => send('clearMessage');
  // «A tutto schermo»: i messaggi inviati occupano lo schermo per qualche secondo, poi passano nella fascia
  let full = false;
  $('cFull').onclick = () => { full = !full; $('cFull').setAttribute('aria-pressed', String(full)); };
  const msgAction = () => full ? 'messageFull' : 'message';
  $('cSend').onclick = () => { const v = $('cText').value.trim(); if (v) send(msgAction(), v).then(ok => { if (ok) $('cText').value = ''; }); };
  $('cText').onkeydown = e => { if (e.key === 'Enter') $('cSend').onclick(); };
  $('list').onclick = e => {
    const row = e.target.closest('.part:not(.song)');
    if (row && B.contains('control')) send('select', row.dataset.i);
  };

  fetch('/api/config', { cache: 'no-store' }).then(r => r.json()).then(c => {
    B.toggle('msgs', !!c.messages);
    if (!c.control) return;
    B.add('can-control');
    $('cPresets').innerHTML = '';
    for (const p of c.presets) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = p; b.onclick = () => send(msgAction(), p);
      $('cPresets').appendChild(b);
    }
    if (params.has('controllo') || params.get('pin')) openControl();
  }).catch(() => { });

  // ── connessione in tempo reale ──
  // con il codice del dispositivo il PC sa che questa pagina può comandare («1 con il controllo»)
  let es = null;
  function connect() {
    es?.close();
    es = new EventSource('/api/events' + (token ? '?t=' + encodeURIComponent(token) : ''));
    es.onmessage = e => { B.remove('offline'); render(JSON.parse(e.data)); };
    es.onerror = () => B.add('offline');
  }
  connect();

  // ── aspetto di questo dispositivo ──
  function markLook() {
    document.querySelectorAll('#lookMenu [data-look]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.look === look)));
  }
  $('btnLook').onclick = e => { e.stopPropagation(); markLook(); B.toggle('look-open'); };
  $('lookMenu').onclick = e => {
    const b = e.target.closest('[data-look]');
    if (!b) return;
    look = b.dataset.look;
    try { localStorage.setItem('timersala-aspetto', look); } catch { }
    B.remove('look-open');
    applyStyle(lastStyle);
    if (look === 'schedule' && !B.contains('panel')) setPanel('schedule');
    else if (look !== 'schedule' && B.contains('panel') && !B.contains('control')) setPanel(null);
    requestAnimationFrame(fit);
  };
  document.addEventListener('click', e => { if (!e.target.closest('#lookMenu')) B.remove('look-open'); });
  if (look === 'schedule') setPanel('schedule');

  // ── schermo sempre acceso (manuale) ──
  // La Wake Lock API funziona solo in HTTPS; sulla rete locale (HTTP) si ricorre
  // a un video muto e invisibile in loop, che impedisce lo spegnimento (tecnica di NoSleep.js, MIT).
  let awake = false, lock = null, video = null;
  try { awake = localStorage.getItem('timersala-wake') === '1'; } catch { }
  async function acquire() {
    if (window.isSecureContext && navigator.wakeLock) {
      try { lock = await navigator.wakeLock.request('screen'); return true; } catch { }
    }
    if (!video) {
      video = document.createElement('video');
      video.id = 'wakeVideo';
      video.muted = true;
      video.loop = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('aria-hidden', 'true');
      video.innerHTML = '<source src="/wake.webm" type="video/webm"><source src="/wake.mp4" type="video/mp4">';
      document.body.appendChild(video);
    }
    try { await video.play(); return true; } catch { return false; }
  }
  function release() {
    lock?.release().catch(() => { }); lock = null;
    video?.pause();
  }
  function showWake() {
    $('btnWake').classList.toggle('on', awake);
    $('btnWake').title = awake ? 'Schermo sempre acceso: attivo' : 'Schermo sempre acceso';
  }
  $('btnWake').onclick = async () => {
    awake = !awake;
    if (awake && !(await acquire())) { awake = false; toast('Non supportato da questo browser'); }
    else if (!awake) release();
    try { localStorage.setItem('timersala-wake', awake ? '1' : '0'); } catch { }
    showWake();
    if (awake) toast('Lo schermo resterà acceso');
    else toast('Lo schermo si spegnerà normalmente');
  };
  document.addEventListener('visibilitychange', () => { if (awake && document.visibilityState === 'visible') acquire(); });
  // se era attivo, riprende al primo tocco (il browser richiede un gesto dell'utente)
  if (awake) {
    showWake();
    acquire().then(ok => { if (!ok) document.addEventListener('pointerdown', () => acquire(), { once: true }); });
  }

  let toastTimer;
  function toast(text) {
    const t = $('toast');
    t.textContent = text; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  fit();
})();
</script>
</body>
</html>
